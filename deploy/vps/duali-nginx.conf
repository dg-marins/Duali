server {
    listen 80;
    listen [::]:80;
    server_name duali.habitaos.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/duali-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name duali.habitaos.com.br;

    ssl_certificate /etc/letsencrypt/live/duali.habitaos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duali.habitaos.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/duali/current;
    index index.html;
    access_log off;
    error_log /var/log/nginx/duali.error.log warn;
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 150s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}