name: duali
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: duali
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: duali
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - duali_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duali -d duali"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  duali_data:

